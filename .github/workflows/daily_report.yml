name: Reporte diario Seed Café

on:
  schedule:
    # Revisa la carpeta de Drive cada 15 minutos durante el horario de la
    # cafetería (13:00-03:00 UTC ≈ 07:00 AM-09:00 PM hora de Ciudad de México).
    - cron: "*/15 13-23,0-3 * * *"
    # Cierre diario RecoPOS: 9:33 PM hora de México (UTC-6) = 03:33 UTC.
    # (no se usa :30 porque coincide con la rejilla del cron de Drive de
    # arriba para la hora 3 UTC, y GitHub fusiona ambos disparos en uno solo
    # — el de Drive siempre "gana" y este nunca se distinguía).
    - cron: "33 3 * * *"
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha a extraer de RecoPOS (YYYY-MM-DD). Vacío = automático (hoy/ayer según la hora)."
        required: false
        type: string

permissions:
  contents: write

jobs:
  generar-reporte:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Los .xlsx con detalle de ventas son sensibles y NO se suben al repo
      # (que es público en esta fase piloto). Se conservan entre ejecuciones
      # (junto con el manifiesto de archivos ya procesados) usando el caché de
      # Actions, que es privado del repositorio.
      - name: Restaurar histórico de datos (caché privado)
        uses: actions/cache@v4
        with:
          path: data
          key: recopos-data-${{ github.run_id }}
          restore-keys: |
            recopos-data-

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Extraer cierre diario RecoPOS (vía API, CAPTCHA por Telegram)
        id: cierre
        if: github.event.schedule == '33 3 * * *' || github.event_name == 'workflow_dispatch'
        env:
          RECOPOS_SHOP_ID: ${{ secrets.RECOPOS_SHOP_ID }}
          RECOPOS_USER: ${{ secrets.RECOPOS_USER }}
          RECOPOS_PASSWORD: ${{ secrets.RECOPOS_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FECHA_OBJETIVO: ${{ github.event.inputs.fecha }}
        run: python recopos_extractor.py

      - name: Buscar y descargar archivos nuevos en Google Drive
        id: sync
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python drive_watcher.py

      - name: Generar dashboard HTML
        if: steps.sync.outputs.hubo_nuevos == 'true' || steps.cierre.outputs.exito == 'true' || github.event_name == 'workflow_dispatch'
        run: python generate_report.py

      - name: Publicar dashboard y cierre del día
        if: steps.sync.outputs.hubo_nuevos == 'true' || steps.cierre.outputs.exito == 'true' || github.event_name == 'workflow_dispatch'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Reporte automático: actualiza dashboard"
          file_pattern: |
            docs/*.html
            docs/*.json
            data_txt/cierre_*.txt
