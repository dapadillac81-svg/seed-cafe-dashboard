name: Reporte diario Seed Café

# La extracción de RecoPOS vive en Render (bot Asistente), que sube data_txt/cierre_*.txt.
# Este workflow solo regenera el dashboard cuando llega un cierre nuevo.
on:
  push:
    branches: [main]
    paths: ["data_txt/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Varios cierres seguidos (pendientes): basta con que termine la última corrida
  group: reporte-diario
  cancel-in-progress: true

jobs:
  generar-reporte:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Los .xlsx históricos son sensibles y no se suben al repo público; viven en el caché privado
      - name: Restaurar histórico de datos (caché privado)
        uses: actions/cache@v4
        with:
          path: data
          key: recopos-data-${{ github.run_id }}
          restore-keys: |
            recopos-data-

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar dashboard HTML
        run: python generate_report.py

      - name: Generar resumen analítico JSON
        run: python generate_summary.py

      - name: Publicar dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/*.html docs/*.json
          if git diff --cached --quiet; then
            echo "Sin cambios para publicar."
            exit 0
          fi
          git commit -m "Reporte automático: actualiza dashboard"
          for intento in 1 2 3; do
            git push && break
            git pull --rebase origin main
          done
