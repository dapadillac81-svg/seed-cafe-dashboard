name: Reporte diario Seed Café

on:
  schedule:
    # 13:00 UTC ≈ 07:00 hora de Ciudad de México (UTC-6 / UTC-5 en horario de verano)
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generar-reporte:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Los .xlsx con detalle de ventas son sensibles y NO se suben al repo
      # (que es público en esta fase piloto). Se conservan entre ejecuciones
      # (junto con el manifiesto de archivos ya procesados) usando el caché de
      # Actions, que es privado del repositorio.
      - name: Restaurar histórico de datos (caché privado)
        uses: actions/cache@v4
        with:
          path: data
          key: recopos-data-${{ github.run_id }}
          restore-keys: |
            recopos-data-

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Buscar y descargar archivos nuevos en Google Drive
        id: sync
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python drive_watcher.py

      - name: Generar dashboard HTML
        run: python generate_report.py

      - name: Publicar dashboard (solo HTML con KPIs agregados)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Reporte automático: actualiza dashboard"
          file_pattern: "docs/*.html"
