name: Reporte diario Seed Café

on:
  schedule:
    # Revisa la carpeta de Drive cada 15 minutos durante el horario de la
    # cafetería (13:00-03:00 UTC ≈ 07:00 AM-09:00 PM hora de Ciudad de México).
    - cron: "*/15 13-23,0-3 * * *"
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha a regenerar el dashboard (YYYY-MM-DD). Vacío = usa datos existentes."
        required: false
        type: string

permissions:
  contents: write

jobs:
  generar-reporte:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Los .xlsx con detalle de ventas son sensibles y NO se suben al repo
      # (que es público en esta fase piloto). Se conservan entre ejecuciones
      # (junto con el manifiesto de archivos ya procesados) usando el caché de
      # Actions, que es privado del repositorio.
      - name: Restaurar histórico de datos (caché privado)
        uses: actions/cache@v4
        with:
          path: data
          key: recopos-data-${{ github.run_id }}
          restore-keys: |
            recopos-data-

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # La extracción de RecoPOS ahora ocurre en Render (telegramBot.js).
      # Este workflow solo descarga de Drive y regenera el dashboard.

      - name: Buscar y descargar archivos nuevos en Google Drive
        id: sync
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python drive_watcher.py

      - name: Verificar historial (advertencia si hay huecos)
        if: steps.sync.outputs.hubo_nuevos == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          python - <<'EOF'
          import os, re, datetime
          txt_dir = "data_txt"
          fechas = set()
          for fn in os.listdir(txt_dir):
              m = re.match(r"cierre_(\d{4}-\d{2}-\d{2})\.txt$", fn)
              if m:
                  fechas.add(datetime.date.fromisoformat(m.group(1)))
          if not fechas:
              print("Sin archivos cierre_*.txt, continuando.")
          else:
              inicio, fin = min(fechas), max(fechas)
              faltantes = [
                  str(inicio + datetime.timedelta(days=i))
                  for i in range((fin - inicio).days + 1)
                  if (d := inicio + datetime.timedelta(days=i)).weekday() != 6
                  and d not in fechas
              ]
              if faltantes:
                  print(f"::warning::Faltan {len(faltantes)} día(s) en el historial: {', '.join(faltantes)}")
              print(f"OK — {inicio} → {fin} ({len(fechas)} días registrados)")
          EOF

      - name: Generar dashboard HTML
        if: steps.sync.outputs.hubo_nuevos == 'true' || github.event_name == 'workflow_dispatch'
        run: python generate_report.py

      - name: Generar resumen analítico JSON
        if: steps.sync.outputs.hubo_nuevos == 'true' || github.event_name == 'workflow_dispatch'
        run: python generate_summary.py

      - name: Publicar dashboard y cierre del día
        if: steps.sync.outputs.hubo_nuevos == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/*.html docs/*.json docs/resumen_analitico.json data_txt/cierre_*.txt
          if git diff --cached --quiet; then
            echo "Sin cambios para publicar."
          else
            git commit -m "Reporte automático: actualiza dashboard"
            for intento in 1 2 3; do
              if git push; then
                break
              fi
              echo "Push rechazado (probablemente otra corrida en paralelo), reintentando con rebase..."
              git pull --rebase origin main
            done
          fi
