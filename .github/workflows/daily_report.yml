name: Reporte diario Seed Café

on:
  schedule:
    # Revisa la carpeta de Drive cada 15 minutos durante el horario de la
    # cafetería (13:00-03:00 UTC ≈ 07:00 AM-09:00 PM hora de Ciudad de México).
    - cron: "*/15 13-23,0-3 * * *"
    # Cierre diario RecoPOS: revisa cada 5 min de 4:00 AM a 10:00 AM MX (10:00-16:00 UTC).
    # Solo actúa si el usuario mandó "cierre" al bot de alertas en los últimos 10 min.
    - cron: "*/5 10-16 * * *"
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha a extraer de RecoPOS (YYYY-MM-DD). Vacío = automático (hoy/ayer según la hora)."
        required: false
        type: string

permissions:
  contents: write

jobs:
  generar-reporte:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Los .xlsx con detalle de ventas son sensibles y NO se suben al repo
      # (que es público en esta fase piloto). Se conservan entre ejecuciones
      # (junto con el manifiesto de archivos ya procesados) usando el caché de
      # Actions, que es privado del repositorio.
      - name: Restaurar histórico de datos (caché privado)
        uses: actions/cache@v4
        with:
          path: data
          key: recopos-data-${{ github.run_id }}
          restore-keys: |
            recopos-data-

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Extraer cierre diario RecoPOS (vía API, CAPTCHA por Telegram)
        id: cierre
        if: github.event.schedule == '*/5 10-16 * * *' || github.event_name == 'workflow_dispatch'
        env:
          RECOPOS_SHOP_ID: ${{ secrets.RECOPOS_SHOP_ID }}
          RECOPOS_USER: ${{ secrets.RECOPOS_USER }}
          RECOPOS_PASSWORD: ${{ secrets.RECOPOS_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FECHA_OBJETIVO: ${{ github.event.inputs.fecha }}
        run: python recopos_extractor.py

      - name: Buscar y descargar archivos nuevos en Google Drive
        id: sync
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python drive_watcher.py

      - name: Verificar historial completo (sin huecos antes de generar)
        if: steps.sync.outputs.hubo_nuevos == 'true' || steps.cierre.outputs.exito == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          python - <<'EOF'
          import os, re, datetime, sys
          txt_dir = "data_txt"
          fechas = set()
          for fn in os.listdir(txt_dir):
              m = re.match(r"cierre_(\d{4}-\d{2}-\d{2})\.txt$", fn)
              if m:
                  fechas.add(datetime.date.fromisoformat(m.group(1)))
          if not fechas:
              print("Sin archivos cierre_*.txt, continuando.")
              sys.exit(0)
          inicio, fin = min(fechas), max(fechas)
          faltantes = [
              str(inicio + datetime.timedelta(days=i))
              for i in range((fin - inicio).days + 1)
              if (d := inicio + datetime.timedelta(days=i)).weekday() != 6
              and d not in fechas
          ]
          if faltantes:
              print(f"::error::Faltan {len(faltantes)} día(s) antes de generar: {', '.join(faltantes)}")
              sys.exit(1)
          print(f"OK — historial completo: {inicio} → {fin} ({len(fechas)} días registrados)")
          EOF

      - name: Generar dashboard HTML
        if: steps.sync.outputs.hubo_nuevos == 'true' || steps.cierre.outputs.exito == 'true' || github.event_name == 'workflow_dispatch'
        run: python generate_report.py

      - name: Generar resumen analítico JSON
        if: steps.sync.outputs.hubo_nuevos == 'true' || steps.cierre.outputs.exito == 'true' || github.event_name == 'workflow_dispatch'
        run: python generate_summary.py

      - name: Publicar dashboard y cierre del día
        if: steps.sync.outputs.hubo_nuevos == 'true' || steps.cierre.outputs.exito == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/*.html docs/*.json docs/resumen_analitico.json data_txt/cierre_*.txt
          if git diff --cached --quiet; then
            echo "Sin cambios para publicar."
          else
            git commit -m "Reporte automático: actualiza dashboard"
            for intento in 1 2 3; do
              if git push; then
                break
              fi
              echo "Push rechazado (probablemente otra corrida en paralelo), reintentando con rebase..."
              git pull --rebase origin main
            done
          fi
