name: Reporte diario Seed Café

on:
  schedule:
    # Intenta extraer el cierre de RecoPOS cada 15 minutos durante el horario
    # de la cafetería (13:00-03:00 UTC ≈ 07:00 AM-09:00 PM hora de Ciudad de
    # México). La mayoría de los ticks no hacen nada (el día ya está
    # procesado) — es barato, y así el reporte sale apenas hay datos nuevos
    # sin depender de que alguien lo dispare a mano.
    - cron: "*/15 13-23,0-3 * * *"
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha a regenerar el dashboard (YYYY-MM-DD). Vacío = usa datos existentes."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  # Evita corridas encimadas: si el login pide CAPTCHA, puede tardar hasta 2h
  # esperando respuesta por Telegram — sin esto, el siguiente tick del
  # schedule (cada 15 min) lanzaría OTRA corrida en paralelo y mandaría un
  # segundo CAPTCHA mientras el primero sigue esperando.
  group: reporte-diario
  cancel-in-progress: false

jobs:
  generar-reporte:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Los .xlsx con detalle de ventas son sensibles y NO se suben al repo
      # (que es público en esta fase piloto). Se conservan entre ejecuciones
      # (junto con el manifiesto de archivos ya procesados) usando el caché de
      # Actions, que es privado del repositorio.
      - name: Restaurar histórico de datos (caché privado)
        uses: actions/cache@v4
        with:
          path: data
          key: recopos-data-${{ github.run_id }}
          restore-keys: |
            recopos-data-

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Extracción de RecoPOS: corre aquí mismo, en cada tick del schedule —
      # ya no depende de que Daniel escriba "cierre" en Telegram, ni de
      # Google Drive como intermediario. El token de sesión se guarda en
      # data/.recopos_token.json (persistido por el caché de arriba) y se
      # reutiliza mientras siga vigente; el CAPTCHA solo se pide por
      # Telegram cuando de verdad hace falta volver a iniciar sesión.
      - name: Extraer cierre diario de RecoPOS
        id: sync
        env:
          RECOPOS_SHOP_ID: ${{ secrets.RECOPOS_SHOP_ID }}
          RECOPOS_USER: ${{ secrets.RECOPOS_USER }}
          RECOPOS_PASSWORD: ${{ secrets.RECOPOS_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FECHA_OBJETIVO: ${{ github.event.inputs.fecha }}
        run: python recopos_extractor.py

      - name: Verificar historial (avisa por Telegram si hay huecos o si el último día está muy atrasado)
        if: steps.sync.outputs.exito == 'true' || github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'EOF'
          import os, re, datetime, urllib.request, json

          def avisar_telegram(texto):
              token = os.environ.get("TELEGRAM_BOT_TOKEN")
              chat_id = os.environ.get("TELEGRAM_CHAT_ID")
              if not token or not chat_id:
                  print("::warning::TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID no configurados — no se pudo avisar.")
                  return
              body = json.dumps({"chat_id": chat_id, "text": texto, "parse_mode": "HTML"}).encode()
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data=body, headers={"Content-Type": "application/json"},
              )
              try:
                  urllib.request.urlopen(req, timeout=10)
              except Exception as e:
                  print(f"::warning::Fallo enviando alerta a Telegram: {e}")

          txt_dir = "data_txt"
          fechas = set()
          for fn in os.listdir(txt_dir):
              m = re.match(r"cierre_(\d{4}-\d{2}-\d{2})\.txt$", fn)
              if m:
                  fechas.add(datetime.date.fromisoformat(m.group(1)))

          if not fechas:
              print("Sin archivos cierre_*.txt, continuando.")
          else:
              inicio, fin = min(fechas), max(fechas)
              faltantes = [
                  str(inicio + datetime.timedelta(days=i))
                  for i in range((fin - inicio).days + 1)
                  if (d := inicio + datetime.timedelta(days=i)).weekday() != 6
                  and d not in fechas
              ]
              if faltantes:
                  msg = f"::warning::Faltan {len(faltantes)} día(s) en el historial: {', '.join(faltantes)}"
                  print(msg)

              # Vigía: si el último cierre registrado tiene más de 2 días hábiles
              # de atraso, algo se rompió (probablemente el CAPTCHA de RecoPOS
              # sigue esperando respuesta, o el login falló) y nadie se va a
              # enterar solo si no se avisa explícitamente.
              hoy = datetime.date.today()
              dias_habiles_atras = sum(
                  1 for i in range(1, (hoy - fin).days + 1)
                  if (hoy - datetime.timedelta(days=i)).weekday() != 6
              )
              if dias_habiles_atras >= 2:
                  avisar_telegram(
                      f"⚠️ <b>SEED CAFÉ — Reporte diario atrasado</b>\n\n"
                      f"El último cierre registrado es del {fin.isoformat()} "
                      f"({dias_habiles_atras} días hábiles de atraso).\n\n"
                      f"Revisa las corridas de 'Reporte diario Seed Café' en GitHub Actions — "
                      f"probablemente el login a RecoPOS está esperando que respondas un CAPTCHA, "
                      f"o falló por otra razón."
                  )

              print(f"OK — {inicio} → {fin} ({len(fechas)} días registrados)")
          EOF

      - name: Generar dashboard HTML
        if: steps.sync.outputs.exito == 'true' || github.event_name == 'workflow_dispatch'
        run: python generate_report.py

      - name: Generar resumen analítico JSON
        if: steps.sync.outputs.exito == 'true' || github.event_name == 'workflow_dispatch'
        run: python generate_summary.py

      - name: Publicar dashboard y cierre del día
        if: steps.sync.outputs.exito == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/*.html docs/*.json docs/resumen_analitico.json data_txt/cierre_*.txt
          if git diff --cached --quiet; then
            echo "Sin cambios para publicar."
          else
            git commit -m "Reporte automático: actualiza dashboard"
            for intento in 1 2 3; do
              if git push; then
                break
              fi
              echo "Push rechazado (probablemente otra corrida en paralelo), reintentando con rebase..."
              git pull --rebase origin main
            done
          fi
