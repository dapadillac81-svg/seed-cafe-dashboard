    /* Sistema visual Seed Café: la fuente única es DESIGN.md en seed-cafe-manager.
       Mismos nombres que el dashboard (allá --color-<nombre>, aquí --<nombre>). */
    :root {
      --espresso: #3b2a20;
      --espresso-700: #4a3728;
      --cream: #f4efe7;
      --cream-200: #ece4d6;
      --white: #ffffff;
      --ink: #2a2620;
      --muted: #6d6559;       /* texto secundario */
      --muted-soft: #8c8272;  /* solo decorativo o deshabilitado */
      --line: #e2d9c9;
      --line-strong: #9b9384;
      --success: #627046;
      --danger: #b3432b;
      --radius-control: 8px;
      --radius-card: 12px;
      --font-serif: 'Fraunces', Georgia, serif;
      --font-display: 'Archivo', 'Inter', sans-serif;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font-sans);
      font-size: 14px;
      background: var(--cream);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* ── Header (blanco, como la barra de la app de inventario) ── */
    header {
      background: var(--white);
      border-bottom: 1px solid var(--line);
      padding: 16px 16px 14px;
      text-align: center;
    }
    header img {
      height: 64px;
      width: auto;
      display: block;
      margin: 0 auto 8px;
    }
    header h1 {
      margin: 0;
      font-family: var(--font-serif);
      font-size: 24px;
      font-weight: 600;
      color: var(--espresso);
      line-height: 1.2;
    }
    header p {
      margin: 4px 0 0;
      font-size: 14px;
      color: var(--muted);
    }

    /* ── Nav bar ─────────────────────────────────── */
    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 16px;
      background: var(--cream);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .nav-bar a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      background: var(--white);
      color: var(--espresso);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-control);
      text-decoration: none;
      font-size: 18px;
      font-weight: 600;
      transition: transform 120ms var(--ease-out), border-color 150ms ease;
      -webkit-user-select: none;
      user-select: none;
    }
    @media (hover: hover) and (pointer: fine) {
      .nav-bar a:hover { border-color: var(--espresso); }
    }
    .nav-bar a:active {
      transform: scale(0.94);
      transition: transform 80ms ease-out;
    }
    .nav-bar a.disabled {
      background: var(--cream-200);
      border-color: transparent;
      color: var(--muted-soft);
      pointer-events: none;
    }
    .nav-bar .nav-fecha {
      font-size: 14px;
      font-weight: 500;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      text-align: center;
    }

    /* ── Main layout ─────────────────────────────── */
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px;
    }

    /* ── KPI grid — staggered entrance ───────────── */
    @keyframes kpi-in {
      from { opacity: 0; transform: translateY(10px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0)   scale(1);    }
    }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }
    .kpi-card {
      background: var(--white);
      border-radius: var(--radius-card);
      padding: 14px;
      border: 1px solid var(--line);
      animation: kpi-in 420ms var(--ease-out) both;
    }
    .kpi-card:nth-child(1) { animation-delay:  60ms; }
    .kpi-card:nth-child(2) { animation-delay: 110ms; }
    .kpi-card:nth-child(3) { animation-delay: 160ms; }
    .kpi-card:nth-child(4) { animation-delay: 210ms; }
    .kpi-card .label {
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .kpi-card .value {
      font-family: var(--font-display);
      font-size: 30px;
      font-weight: 900;
      color: var(--ink);
      line-height: 1;
      font-variant-numeric: tabular-nums;
      margin-top: 6px;
    }
    .kpi-card .delta { font-size: 14px; margin-top: 6px; font-weight: 500; color: var(--muted); }
    .delta.up   { color: var(--success); }
    .delta.down { color: var(--danger);  }

    /* ── Chart cards ─────────────────────────────── */
    .chart-card {
      background: var(--white);
      border-radius: var(--radius-card);
      padding: 10px;
      margin-bottom: 12px;
      border: 1px solid var(--line);
      overflow-x: auto;
      opacity: 0;
      transform: translateY(14px);
    }
    .chart-card.visible {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 400ms var(--ease-out),
                  transform 400ms var(--ease-out);
    }

    /* ── Botón Plan de producción (primario) ─────── */
    .btn-produccion {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 12px 18px;
      background: var(--espresso);
      color: var(--cream);
      border-radius: var(--radius-control);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      transition: transform 120ms var(--ease-out), background 150ms ease;
      -webkit-user-select: none;
      user-select: none;
    }
    .btn-produccion:active {
      transform: scale(0.96);
      transition: transform 80ms ease-out;
    }
    @media (hover: hover) and (pointer: fine) {
      .btn-produccion:hover { background: var(--espresso-700); }
    }
    .chart-card .plotly-graph-div,
    .chart-card .plotly-graph-div * {
      touch-action: pan-y !important;
    }

    /* ── Empty state ─────────────────────────────── */
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 28px 16px;
      font-size: 14px;
      line-height: 1.5;
    }

    /* ── Footer ──────────────────────────────────── */
    footer {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      padding: 20px 16px;
    }

    /* ── Reduced motion ──────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      .kpi-card  { animation: none; }
      .chart-card { opacity: 1; transform: none; }
      .chart-card.visible { transition: none; }
      .btn-produccion { transition: background 150ms ease; }
      .nav-bar a { transition: border-color 150ms ease; }
    }
  </style>

  <script>
    function initDashboard() {
      // Desactiva zoom y doble clic en gráficos Plotly
      function fijarGraficos() {
        document.querySelectorAll('.plotly-graph-div').forEach(function(div) {
          if (window.Plotly && div.layout !== undefined) {
            window.Plotly.relayout(div, { dragmode: false });
            div.on('plotly_doubleclick', function() { return false; });
          }
        });
      }
      setTimeout(fijarGraficos, 800);

      var STORAGE_KEY = 'seedcafe_scroll_chart';
      var navBar = document.querySelector('.nav-bar');
      function navH() { return navBar ? navBar.offsetHeight : 0; }

      // Ancla = la tarjeta que MÁS píxeles ocupa en pantalla en este momento.
      // En móvil caben 2-3 gráficas a la vez, así que "la última que reportó
      // el IntersectionObserver" elegía cualquiera de ellas, no la que se está
      // viendo. Se calcula en el momento del clic, que es cuando importa.
      // Se guarda también el desplazamiento dentro de la tarjeta para
      // reproducir el encuadre exacto (no solo el inicio de la gráfica).
      function anclaActual() {
        var vh = window.innerHeight, tope = navH();
        var mejor = null, mejorPx = 0;
        document.querySelectorAll('.chart-card[data-chart-id]').forEach(function(c) {
          var r = c.getBoundingClientRect();
          var px = Math.min(r.bottom, vh) - Math.max(r.top, tope);
          if (px > mejorPx) { mejorPx = px; mejor = c; }
        });
        if (!mejor || mejorPx <= 0) return null;
        return {
          id: mejor.getAttribute('data-chart-id'),
          offset: Math.round(mejor.getBoundingClientRect().top - tope)
        };
      }

      // Chart cards: fade-in al hacer scroll (una sola vez por card).
      // Si hay savedId (restaurar posición), todos los cards se muestran
      // instantáneamente para que el layout esté estable antes del scroll.
      var chartCards = document.querySelectorAll('.chart-card');
      var restoringScroll = !!sessionStorage.getItem(STORAGE_KEY);
      if (restoringScroll) {
        // Modo restaurar: sin animación, layout estable
        chartCards.forEach(function(c) {
          c.style.transition = 'none';
          c.classList.add('visible');
        });
      } else if ('IntersectionObserver' in window) {
        var cardObserver = new IntersectionObserver(function(entries) {
          entries.forEach(function(entry) {
            if (entry.isIntersecting) {
              var card = entry.target;
              var delay = parseInt(card.getAttribute('data-stagger') || '0');
              setTimeout(function() { card.classList.add('visible'); }, delay);
              cardObserver.unobserve(card);
            }
          });
        }, { threshold: 0.08 });
        chartCards.forEach(function(card, i) {
          card.setAttribute('data-stagger', String(i * 50));
          cardObserver.observe(card);
        });
      } else {
        chartCards.forEach(function(c) { c.classList.add('visible'); });
      }

      // Al pulsar ← →: guarda la gráfica dominante y el encuadre exacto.
      document.querySelectorAll('.nav-bar a:not(.disabled)').forEach(function(link) {
        link.addEventListener('click', function() {
          var ancla = anclaActual();
          if (ancla) sessionStorage.setItem(STORAGE_KEY, JSON.stringify(ancla));
          else sessionStorage.removeItem(STORAGE_KEY);
        });
      });

      function mostrar() { document.documentElement.style.visibility = 'visible'; }

      // Al cargar: reanclar a la gráfica guardada mientras la página está oculta.
      var guardado = sessionStorage.getItem(STORAGE_KEY);
      sessionStorage.removeItem(STORAGE_KEY); // se consume una sola vez
      var ancla = null;
      try { ancla = guardado ? JSON.parse(guardado) : null; } catch (e) { ancla = null; }
      var target = ancla ? document.querySelector('.chart-card[data-chart-id="' + ancla.id + '"]') : null;

      if (!target) {
        mostrar();
      } else {
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

        // Detectar interacción REAL del usuario: el evento 'scroll' no sirve,
        // lo dispara nuestro propio scrollTo y cancelaba la restauración.
        var usuarioIntervino = false;
        ['wheel', 'touchstart', 'keydown'].forEach(function(ev) {
          window.addEventListener(ev, function() { usuarioIntervino = true; },
            { passive: true, once: true });
        });

        // Plotly redimensiona las gráficas en varias pasadas después de cargar.
        // En vez de adivinar cuándo termina, se reancla en cada frame hasta que
        // la altura deja de cambiar — así el reflow nunca se ve como un salto.
        var inicio = performance.now();
        var alturaPrev = -1, framesEstables = 0;

        function reanclar() {
          var y = target.getBoundingClientRect().top + window.scrollY - navH() - ancla.offset;
          window.scrollTo(0, Math.max(0, Math.round(y)));
        }

        function paso() {
          if (usuarioIntervino) { mostrar(); return; }
          reanclar();
          var h = document.body.scrollHeight;
          if (h === alturaPrev) { framesEstables++; } else { framesEstables = 0; alturaPrev = h; }
          var transcurrido = performance.now() - inicio;
          // ~10 frames sin reflow y mínimo 300ms, o tope duro de 3s.
          if ((framesEstables >= 10 && transcurrido > 300) || transcurrido > 3000) {
            mostrar();
            return;
          }
          requestAnimationFrame(paso);
        }
        requestAnimationFrame(paso);
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      // Si hay una gráfica guardada para restaurar, la página se queda oculta
      // (ver <script> en <head>) hasta que initDashboard() calcule el scroll
      // correcto y la muestre — mostrarla aquí de inmediato rompe eso y causa
      // el salto (aparece arriba, luego brinca a la gráfica).
      if (!sessionStorage.getItem('seedcafe_scroll_chart')) {
        document.documentElement.style.visibility = 'visible';
      }
      initDashboard();
    });

    // Service worker: network-first para HTML, offline fallback para assets
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js').catch(function() {});
      });
    }
  </script>
