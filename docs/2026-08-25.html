  <style>
    :root {
      --bg: #f2ede8;
      --card: #ffffff;
      --ink: #1c130c;
      --ink-secondary: #4a3728;
      --accent: #6f4e37;
      --accent-hover: #5a3f2c;
      --accent-light: #b08968;
      --good: #1a7a47;
      --bad: #c0392b;
      --muted: #8a7b6c;
      --border: rgba(111,78,55,0.12);
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.04), 0 2px 8px rgba(0,0,0,0.06);
      --shadow-md: 0 2px 4px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.08);
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 20px;
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
      font-optical-sizing: auto;
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* ── Header ─────────────────────────────────── */
    header {
      background: var(--accent);
      color: #fff;
      padding: 20px 16px 18px;
      text-align: center;
    }
    header img {
      height: 68px;
      width: auto;
      display: block;
      margin: 0 auto 10px;
      border-radius: var(--radius-sm);
      background: rgba(255,255,255,0.15);
      padding: 4px;
      backdrop-filter: blur(4px);
    }
    header h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    header p {
      margin: 4px 0 0;
      font-size: 0.8rem;
      opacity: 0.75;
      letter-spacing: 0.01em;
    }

    /* ── Nav bar — translucent Apple material ────── */
    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: rgba(242, 237, 232, 0.75);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .nav-bar a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 36px;
      background: var(--accent);
      color: #fff;
      border-radius: var(--radius-sm);
      text-decoration: none;
      font-size: 1.05rem;
      font-weight: 600;
      transition: transform 120ms var(--ease-out), background 150ms ease;
      -webkit-user-select: none;
      user-select: none;
    }
    @media (hover: hover) and (pointer: fine) {
      .nav-bar a:hover { background: var(--accent-hover); }
    }
    .nav-bar a:active {
      transform: scale(0.94);
      transition: transform 80ms ease-out;
    }
    .nav-bar a.disabled {
      background: rgba(111,78,55,0.15);
      color: var(--muted);
      pointer-events: none;
    }
    .nav-bar .nav-fecha {
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--ink-secondary);
      letter-spacing: 0.01em;
      text-align: center;
    }

    /* ── Main layout ─────────────────────────────── */
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 18px 16px;
    }

    /* ── KPI grid — staggered entrance ───────────── */
    @keyframes kpi-in {
      from { opacity: 0; transform: translateY(10px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0)   scale(1);    }
    }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .kpi-card {
      background: var(--card);
      border-radius: var(--radius-md);
      padding: 16px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      animation: kpi-in 420ms var(--ease-out) both;
    }
    .kpi-card:nth-child(1) { animation-delay:  60ms; }
    .kpi-card:nth-child(2) { animation-delay: 110ms; }
    .kpi-card:nth-child(3) { animation-delay: 160ms; }
    .kpi-card:nth-child(4) { animation-delay: 210ms; }
    .kpi-card .label {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .kpi-card .value {
      font-size: 1.65rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.025em;
      line-height: 1.15;
      margin-top: 4px;
    }
    .kpi-card .delta { font-size: 0.78rem; margin-top: 5px; font-weight: 500; }
    .delta.up   { color: var(--good); }
    .delta.down { color: var(--bad);  }

    /* ── Chart cards ─────────────────────────────── */
    .chart-card {
      background: var(--card);
      border-radius: var(--radius-md);
      padding: 10px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      overflow-x: auto;
      opacity: 0;
      transform: translateY(14px);
    }
    .chart-card.visible {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 400ms cubic-bezier(0.23, 1, 0.32, 1),
                  transform 400ms cubic-bezier(0.23, 1, 0.32, 1);
    }

    /* ── Botón Plan de producción ────────────────── */
    .btn-produccion {
      display: inline-block;
      padding: 8px 16px;
      background: var(--accent-light);
      color: #fff;
      border-radius: var(--radius-sm);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      font-family: inherit;
      letter-spacing: -0.01em;
      transition: transform 120ms cubic-bezier(0.23, 1, 0.32, 1), background 150ms ease;
      -webkit-user-select: none;
      user-select: none;
    }
    .btn-produccion:active {
      transform: scale(0.96);
      transition: transform 80ms ease-out;
    }
    @media (hover: hover) and (pointer: fine) {
      .btn-produccion:hover { background: var(--accent); }
    }
    .chart-card .plotly-graph-div,
    .chart-card .plotly-graph-div * {
      touch-action: pan-y !important;
    }

    /* ── Empty state ─────────────────────────────── */
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 28px 16px;
      font-size: 0.88rem;
      line-height: 1.5;
    }

    /* ── Footer ──────────────────────────────────── */
    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.01em;
      padding: 20px 16px;
    }

    /* ── Reduced motion ──────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      .kpi-card  { animation: none; }
      .chart-card { opacity: 1; transform: none; }
      .chart-card.visible { transition: none; }
      .btn-produccion { transition: background 150ms ease; }
      .nav-bar a { transition: background 150ms ease; }
    }
  </style>

    function initDashboard() {

        });

          observer.observe(c);
        });

      var restoringScroll = !!sessionStorage.getItem(STORAGE_KEY);

          c.classList.add('visible');
        });

            if (entry.isIntersecting) {

              setTimeout(function() { card.classList.add('visible'); }, delay);

            if (stableCount >= 4) { clearTimeout(maxWait); doScroll(); return; }
          } else {
            stableCount = 0;
            lastH = h;
          }
          setTimeout(pollLayout, 100);
        }
        setTimeout(pollLayout, 100);
      } else {
