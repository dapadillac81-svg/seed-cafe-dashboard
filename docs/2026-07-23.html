  <style>
    :root {
      --bg: #f2ede8;
      --card: #ffffff;
      --ink: #1c130c;
      --ink-secondary: #4a3728;
      --accent: #6f4e37;
      --accent-hover: #5a3f2c;
      --accent-light: #b08968;
      --good: #1a7a47;
      --bad: #c0392b;
      --muted: #8a7b6c;
      --border: rgba(111,78,55,0.12);
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.04), 0 2px 8px rgba(0,0,0,0.06);
      --shadow-md: 0 2px 4px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.08);
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 20px;
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
      font-optical-sizing: auto;
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* ── Header ─────────────────────────────────── */
    header {
      background: var(--accent);
      color: #fff;
      padding: 20px 16px 18px;
      text-align: center;
    }
    header img {
      height: 68px;
      width: auto;
      display: block;
      margin: 0 auto 10px;
      border-radius: var(--radius-sm);
      background: rgba(255,255,255,0.15);
      padding: 4px;
      backdrop-filter: blur(4px);
    }
    header h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    header p {
      margin: 4px 0 0;
      font-size: 0.8rem;
      opacity: 0.75;
      letter-spacing: 0.01em;
    }

    /* ── Nav bar — translucent Apple material ────── */
    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: rgba(242, 237, 232, 0.75);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .nav-bar a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 36px;
      background: var(--accent);
      color: #fff;
      border-radius: var(--radius-sm);
      text-decoration: none;
      font-size: 1.05rem;
      font-weight: 600;
      transition: transform 120ms var(--ease-out), background 150ms ease;
      -webkit-user-select: none;
      user-select: none;
    }
    @media (hover: hover) and (pointer: fine) {
      .nav-bar a:hover { background: var(--accent-hover); }
    }
    .nav-bar a:active {
      transform: scale(0.94);
      transition: transform 80ms ease-out;
    }
    .nav-bar a.disabled {
      background: rgba(111,78,55,0.15);
      color: var(--muted);
      pointer-events: none;
    }
    .nav-bar .nav-fecha {
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--ink-secondary);
      letter-spacing: 0.01em;
      text-align: center;
    }

    /* ── Main layout ─────────────────────────────── */
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 18px 16px;
    }

    /* ── KPI grid — staggered entrance ───────────── */
    @keyframes kpi-in {
      from { opacity: 0; transform: translateY(10px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0)   scale(1);    }
    }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .kpi-card {
      background: var(--card);
      border-radius: var(--radius-md);
      padding: 16px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      animation: kpi-in 420ms var(--ease-out) both;
    }
    .kpi-card:nth-child(1) { animation-delay:  60ms; }
    .kpi-card:nth-child(2) { animation-delay: 110ms; }
    .kpi-card:nth-child(3) { animation-delay: 160ms; }
    .kpi-card:nth-child(4) { animation-delay: 210ms; }
    .kpi-card .label {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .kpi-card .value {
      font-size: 1.65rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.025em;
      line-height: 1.15;
      margin-top: 4px;
    }
    .kpi-card .delta { font-size: 0.78rem; margin-top: 5px; font-weight: 500; }
    .delta.up   { color: var(--good); }
    .delta.down { color: var(--bad);  }

    /* ── Chart cards ─────────────────────────────── */
    .chart-card {
      background: var(--card);
      border-radius: var(--radius-md);
      padding: 10px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      overflow-x: auto;
      opacity: 0;
      transform: translateY(14px);
    }
    .chart-card.visible {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 400ms cubic-bezier(0.23, 1, 0.32, 1),
                  transform 400ms cubic-bezier(0.23, 1, 0.32, 1);
    }

    /* ── Botón Plan de producción ────────────────── */
    .btn-produccion {
      display: inline-block;
      padding: 8px 16px;
      background: var(--accent-light);
      color: #fff;
      border-radius: var(--radius-sm);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      font-family: inherit;
      letter-spacing: -0.01em;
      transition: transform 120ms cubic-bezier(0.23, 1, 0.32, 1), background 150ms ease;
      -webkit-user-select: none;
      user-select: none;
    }
    .btn-produccion:active {
      transform: scale(0.96);
      transition: transform 80ms ease-out;
    }
    @media (hover: hover) and (pointer: fine) {
      .btn-produccion:hover { background: var(--accent); }
    }
    .chart-card .plotly-graph-div,
    .chart-card .plotly-graph-div * {
      touch-action: pan-y !important;
    }

    /* ── Empty state ─────────────────────────────── */
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 28px 16px;
      font-size: 0.88rem;
      line-height: 1.5;
    }

    /* ── Footer ──────────────────────────────────── */
    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.01em;
      padding: 20px 16px;
    }

    /* ── Reduced motion ──────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      .kpi-card  { animation: none; }
      .chart-card { opacity: 1; transform: none; }
      .chart-card.visible { transition: none; }
      .btn-produccion { transition: background 150ms ease; }
      .nav-bar a { transition: background 150ms ease; }
    }
  </style>

  <script>
    function initDashboard() {
      // Desactiva zoom y doble clic en gráficos Plotly
      function fijarGraficos() {
        document.querySelectorAll('.plotly-graph-div').forEach(function(div) {
          if (window.Plotly && div.layout !== undefined) {
            window.Plotly.relayout(div, { dragmode: false });
            div.on('plotly_doubleclick', function() { return false; });
          }
        });
      }
      setTimeout(fijarGraficos, 800);

      var STORAGE_KEY = 'seedcafe_scroll_chart';
      var navBar = document.querySelector('.nav-bar');

      // IntersectionObserver: rastrea continuamente qué gráfico está visible.
      // Así cuando el usuario pulsa ← →, el ID ya está guardado sin necesidad
      // de calcular getBoundingClientRect en el momento del clic.
      var currentVisibleId = null;
      if ('IntersectionObserver' in window) {
        var navHeight = navBar ? navBar.offsetHeight : 0;
        var observer = new IntersectionObserver(function(entries) {
          entries.forEach(function(entry) {
            if (entry.isIntersecting && entry.intersectionRatio >= 0.15) {
              currentVisibleId = entry.target.getAttribute('data-chart-id');
            }
          });
        }, {
          rootMargin: '-' + navHeight + 'px 0px 0px 0px',
          threshold: 0.15
        });
        document.querySelectorAll('.chart-card[data-chart-id]').forEach(function(c) {
          observer.observe(c);
        });
      }

      // Chart cards: fade-in al hacer scroll (una sola vez por card).
      // Si hay savedId (restaurar posición), todos los cards se muestran
      // instantáneamente para que el layout esté estable antes del scroll.
      var chartCards = document.querySelectorAll('.chart-card');
      var restoringScroll = !!sessionStorage.getItem(STORAGE_KEY);
      if (restoringScroll) {
        // Modo restaurar: sin animación, layout estable
        chartCards.forEach(function(c) {
          c.style.transition = 'none';
          c.classList.add('visible');
        });
      } else if ('IntersectionObserver' in window) {
        var cardObserver = new IntersectionObserver(function(entries) {
          entries.forEach(function(entry) {
            if (entry.isIntersecting) {
              var card = entry.target;
              var delay = parseInt(card.getAttribute('data-stagger') || '0');
              setTimeout(function() { card.classList.add('visible'); }, delay);
              cardObserver.unobserve(card);
            }
          });
        }, { threshold: 0.08 });
        chartCards.forEach(function(card, i) {
          card.setAttribute('data-stagger', String(i * 50));
          cardObserver.observe(card);
        });
      } else {
        chartCards.forEach(function(c) { c.classList.add('visible'); });
      }

      // Al pulsar ← →: guarda el gráfico que el observer está viendo ahora
      document.querySelectorAll('.nav-bar a:not(.disabled)').forEach(function(link) {
        link.addEventListener('click', function() {
          if (currentVisibleId) {
            sessionStorage.setItem(STORAGE_KEY, currentVisibleId);
          } else {
            sessionStorage.removeItem(STORAGE_KEY);
          }
        });
      });

      // Al cargar: scroll al gráfico guardado.
      // Solo cancela si el usuario realmente DESPLAZA la página (no solo toca).
      var savedId = sessionStorage.getItem(STORAGE_KEY);
      if (savedId) {
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

        var userScrolled = false;
        window.addEventListener('scroll', function() { userScrolled = true; }, { passive: true, once: true });

        var navH = navBar ? navBar.offsetHeight : 0;
        var attempts = 0;

        function show() { document.documentElement.style.visibility = 'visible'; }

        // Seguridad: mostrar la página aunque todo falle
        var safetyTimer = setTimeout(doScroll, 3000);

        function doScroll() {
          clearTimeout(safetyTimer);
          if (userScrolled) { show(); return; }
          var target = document.querySelector('.chart-card[data-chart-id="' + savedId + '"]');
          if (target) {
            var top = target.getBoundingClientRect().top + window.scrollY - navH - 8;
            window.scrollTo({ top: Math.max(top, 0), behavior: 'instant' });
            // Un reintento 150ms después para absorber cualquier reflow residual
            setTimeout(function() {
              if (!userScrolled) {
                var top2 = target.getBoundingClientRect().top + window.scrollY - navH - 8;
                window.scrollTo({ top: Math.max(top2, 0), behavior: 'instant' });
              }
              show();
            }, 150);
          } else {
            show();
          }
        }

        // Esperar a que el layout se estabilice: pollea el scrollHeight cada 100ms.
        // Cuando no cambia 4 veces seguidas (400ms sin reflow), hace el scroll.
        // Esto es más confiable que plotly_afterplot (que usa .on(), no addEventListener).
        var lastH = 0, stableCount = 0;
        var maxWait = setTimeout(doScroll, 4000); // fallback absoluto: 4s
        function pollLayout() {
          if (userScrolled) { clearTimeout(maxWait); show(); return; }
          var h = document.body.scrollHeight;
          if (h > 0 && h === lastH) {
            stableCount++;
            if (stableCount >= 4) { clearTimeout(maxWait); doScroll(); return; }
          } else {
            stableCount = 0;
            lastH = h;
          }
          setTimeout(pollLayout, 100);
        }
        setTimeout(pollLayout, 100);
      } else {
        document.documentElement.style.visibility = 'visible';
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      document.documentElement.style.visibility = 'visible';
      initDashboard();
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js').catch(function() {});
      });
    }
